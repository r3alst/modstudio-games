<svg class="cooking" viewBox="0 0 320 300" role="img" aria-labelledby="cooking-title" xmlns="http://www.w3.org/2000/svg">
  <title id="cooking-title">Cooking something cool</title>
  <style>
    .cooking .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 0.9s ease-in-out infinite alternate; }
    .cooking .f2 { animation-duration: 0.7s; animation-delay: -0.3s; }
    .cooking .f3 { animation-duration: 1.1s; animation-delay: -0.6s; }

    .cooking .pot { transform-box: fill-box; transform-origin: 50% 100%; animation: simmer 2.4s ease-in-out infinite; }

    .cooking .bubble { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: pop 1.8s ease-out infinite; }
    .cooking .b2 { animation-delay: 0.6s; }
    .cooking .b3 { animation-delay: 1.2s; }

    .cooking .wisp { stroke-dasharray: 60; stroke-dashoffset: 60; opacity: 0; animation: steam 3s ease-in-out infinite; }
    .cooking .w2 { animation-delay: 1s; }
    .cooking .w3 { animation-delay: 2s; }

    .cooking .spark { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: rise 4s ease-out infinite; }
    .cooking .s2 { animation-delay: 1s; }
    .cooking .s3 { animation-delay: 2s; }
    .cooking .s4 { animation-delay: 3s; }

    .cooking .label { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    .cooking .dot { opacity: 0.2; animation: blink 1.2s ease-in-out infinite; }
    .cooking .d2 { animation-delay: 0.2s; }
    .cooking .d3 { animation-delay: 0.4s; }

    @keyframes flicker { from { transform: scale(1, 1); } to { transform: scale(0.85, 1.18); } }
    @keyframes simmer { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-1px) rotate(-0.6deg); } 75% { transform: translateY(-1px) rotate(0.6deg); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.2); } 30% { opacity: 1; } 80% { opacity: 1; transform: scale(1) translateY(-4px); } 100% { opacity: 0; transform: scale(1.3) translateY(-6px); } }
    @keyframes steam { 0% { stroke-dashoffset: 60; opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { stroke-dashoffset: -60; opacity: 0; transform: translateY(-14px); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0) rotate(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-95px) rotate(200deg); } }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .cooking * { animation: none !important; }
      .cooking .wisp { stroke-dashoffset: 0; opacity: 0.6; }
      .cooking .dot { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="pot-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c44"/>
      <stop offset="1" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.55" stop-color="#ff9e3d"/>
      <stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="0.5" stop-color="#ff4d9d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <!-- Game-shaped sparks floating out of the pot -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle class="spark s1" cx="132" cy="118" r="7" stroke="#8b6cff"/>
    <path class="spark s2" d="M188 108 l8 14 h-16 z" stroke="#ff4d9d"/>
    <rect class="spark s3" x="150" y="110" width="13" height="13" rx="2" stroke="#ffb347"/>
    <path class="spark s4" d="M172 106 v14 M165 113 h14" stroke="#4dd9ff"/>
  </g>

  <!-- Steam -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <path class="wisp w1" d="M128 120 c-10 -14 10 -22 0 -40"/>
    <path class="wisp w2" d="M160 116 c-10 -14 10 -22 0 -42"/>
    <path class="wisp w3" d="M192 120 c-10 -14 10 -22 0 -40"/>
  </g>

  <!-- Bubbles popping at the surface -->
  <g fill="#8b6cff">
    <circle class="bubble b1" cx="128" cy="126" r="5"/>
    <circle class="bubble b2" cx="162" cy="124" r="6" fill="#ff4d9d"/>
    <circle class="bubble b3" cx="192" cy="126" r="4" fill="#ffb347"/>
  </g>

  <!-- Pot -->
  <g class="pot">
    <rect x="76" y="150" width="26" height="9" rx="4.5" fill="#34344f"/>
    <rect x="218" y="150" width="26" height="9" rx="4.5" fill="#34344f"/>
    <path d="M104 140 h112 v36 a26 26 0 0 1 -26 26 h-60 a26 26 0 0 1 -26 -26 z" fill="url(#pot-grad)" stroke="#3e3e5e" stroke-width="2"/>
    <rect x="96" y="130" width="128" height="14" rx="7" fill="#3a3a58"/>
    <path d="M116 158 v20 a12 12 0 0 0 6 10" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Flames -->
  <g fill="url(#flame-grad)">
    <path class="flame f1" d="M136 234 c-9 0 -11 -9 -6 -16 c3 -4 6 -8 6 -12 c4 6 11 13 10 21 c-1 5 -5 7 -10 7 z"/>
    <path class="flame f2" d="M160 234 c-11 0 -13 -11 -7 -19 c3 -5 7 -10 7 -15 c5 7 13 16 12 25 c-1 6 -6 9 -12 9 z"/>
    <path class="flame f3" d="M184 234 c-9 0 -11 -9 -6 -16 c3 -4 6 -8 6 -12 c4 6 11 13 10 21 c-1 5 -5 7 -10 7 z"/>
  </g>
  <rect x="108" y="234" width="104" height="6" rx="3" fill="#2a2a40"/>

  <text class="label" x="160" y="284" text-anchor="middle" fill="url(#text-grad)">Cooking something cool<tspan class="dot d1">.</tspan><tspan class="dot d2">.</tspan><tspan class="dot d3">.</tspan></text>
</svg>
